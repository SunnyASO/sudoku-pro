<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Pro - Zen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container relative-container">
        <div class="top-right-controls">
            <button id="mute-btn" class="icon-btn" title="Toggle Sound">🔊</button>
            <button id="tutorial-btn" class="icon-btn" title="How to Play">💡</button>
        </div>
        <header>
            <h1>数独</h1> <!-- Sudoku in Japanese kanji -->
            <p class="subtitle">Sudoku Pro</p>
            <div class="header-stats">
                <div id="timer" class="timer">00:00</div>
                <div id="mistakes" class="mistakes">Mistakes: 0/3</div>
            </div>
        </header>
        
        <main>
            <div id="sudoku-board" class="sudoku-board">
                <!-- Grid cells will be generated by JavaScript -->
            </div>

            <div class="controls">
                <button id="new-game-btn" class="btn">New Game</button>
                <button id="undo-btn" class="btn undo-btn">
                    <span class="icon">↺</span> Undo (<span id="undo-count">3</span>)
                </button>
                <button id="hint-btn" class="btn hint-btn">
                    <span class="icon">💡</span> Hint (<span id="hint-count">3</span>)
                </button>
            </div>

            <div id="numpad" class="numpad">
                <!-- Numpad buttons will be generated by JS -->
            </div>
        </main>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Game Over</h2>
            <p>You made 3 mistakes!</p>
            <div class="modal-buttons">
                <button id="try-again-btn" class="btn hint-btn">Try Again</button>
                <button id="restart-game-btn" class="btn">New Game</button>
            </div>
        </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="modal hidden">
        <div class="modal-content tutorial-content">
            <h2>How to Play</h2>
            <p id="tutorial-text">Every row, column, and 3x3 grid must contain the numbers 1 to 9.</p>
            <div class="tutorial-footer">
                <span id="tutorial-step-indicator" class="step-indicator">1 / 4</span>
                <div class="modal-buttons">
                    <button id="tutorial-skip-btn" class="btn hint-btn">Skip</button>
                    <button id="tutorial-next-btn" class="btn">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
